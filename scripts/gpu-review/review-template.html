<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPU review — blinded A/B</title>
<style>
  :root { --bg:#0b0e0d; --surface:#101412; --surface2:#151a17; --line:#252c28; --text:#edf3ef; --muted:#8f9b94; --accent:#c6ff63; --danger:#ff7f7f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 'Segoe UI',system-ui,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:10; }
  header h1 { font-size:16px; margin:0 0 4px; }
  header .sub { color:var(--muted); font-size:12px; }
  main { padding:16px 20px 80px; max-width:1400px; margin:0 auto; }
  .pair { border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:22px; overflow:hidden; }
  .pair-head { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .pair-head .pid { font-weight:700; font-size:15px; }
  .mode-btns { display:flex; gap:4px; margin-left:auto; }
  .mode-btns button { font:inherit; font-size:12px; padding:4px 10px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); border-radius:6px; cursor:pointer; }
  .mode-btns button.on { color:#142000; background:var(--accent); border-color:var(--accent); font-weight:600; }
  .stage { position:relative; background:#000; user-select:none; }
  .stage video { display:block; width:100%; }
  .stage.sbs { display:grid; grid-template-columns:1fr 1fr; gap:2px; }
  .stage.slider, .stage.blink { cursor:ew-resize; }
  .stage.slider .v-top { position:absolute; inset:0; clip-path:inset(0 calc(100% - var(--split,50%)) 0 0); }
  .stage.blink .v-top { position:absolute; inset:0; visibility:hidden; }
  .stage.blink.show-top .v-top { visibility:visible; }
  .stage.blink.show-top .v-base { visibility:hidden; }
  .stage .divider { position:absolute; top:0; bottom:0; width:3px; background:var(--accent); left:var(--split,50%); transform:translateX(-1.5px); pointer-events:none; box-shadow:0 0 8px rgba(198,255,99,.5); }
  .stage .divider::after { content:'⇔'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--accent); color:#142000; font-size:13px; padding:2px 6px; border-radius:8px; font-weight:700; }
  .stage .tag { position:absolute; top:8px; font-size:11px; background:rgba(0,0,0,.65); padding:2px 8px; border-radius:4px; color:var(--muted); }
  .stage .tag.l { left:8px; } .stage .tag.r { right:8px; }
  .transport { display:flex; gap:6px; align-items:center; padding:8px 14px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .transport button { font:inherit; font-size:12px; padding:4px 10px; border:1px solid var(--line); background:var(--surface2); color:var(--text); border-radius:6px; cursor:pointer; }
  .transport button:hover { border-color:var(--muted); }
  .transport .t { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .transport .spacer { flex:1; }
  .transport .rate { color:var(--muted); font-size:12px; }
  .transport input[type=range] { width:110px; accent-color:var(--accent); }
  .calls { display:flex; gap:6px; padding:10px 14px 14px; flex-wrap:wrap; align-items:center; }
  .calls button { font:inherit; font-size:13px; padding:7px 16px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--text); cursor:pointer; }
  .calls button.win { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .calls button.win.sel { background:var(--accent); color:#142000; }
  .calls button.tie.sel { background:var(--muted); color:var(--bg); border-color:var(--muted); }
  .calls button.na.sel { background:var(--danger); color:var(--bg); border-color:var(--danger); }
  .calls .note { flex:1 1 220px; font:inherit; font-size:12px; padding:6px 10px; border:1px solid var(--line); background:var(--surface2); color:var(--text); border-radius:8px; min-width:180px; }
  .calls .saved { color:var(--muted); font-size:11px; }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line); padding:10px 20px; display:flex; gap:10px; align-items:center; }
  footer .count { color:var(--muted); font-size:12px; }
  footer button { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; font-weight:600; }
  .fullscreen-stage:fullscreen { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:#000; }
  .fullscreen-stage:fullscreen video { max-height:100vh; width:auto; max-width:100%; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>GPU review — blinded A/B</h1>
  <div class="sub" id="hdr-sub">Left/right assignments are randomized per pair. The key is escrowed — calls recorded before reveal. Ties are valid.</div>
</header>
<main id="pairs"></main>
<footer>
  <span class="count" id="count"></span>
  <span style="flex:1"></span>
  <button id="export">Export responses JSON</button>
</footer>
<template id="pair-tpl">
  <section class="pair" data-pair="">
    <div class="pair-head">
      <span class="pid"></span>
      <div class="mode-btns">
        <button data-mode="sbs" class="on">Side-by-side</button>
        <button data-mode="slider">Slider</button>
        <button data-mode="blink">Blink</button>
        <button class="fs" title="Fullscreen (uses current mode)">⛶</button>
      </div>
    </div>
    <div class="stage sbs">
      <video class="v-base" playsinline></video>
      <video class="v-top" playsinline></video>
      <div class="divider hidden"></div>
      <span class="tag l hidden">L</span><span class="tag r hidden">R</span>
    </div>
    <div class="transport">
      <button class="play">⏯ Play/Pause</button>
      <button class="stepb">⟨ frame</button><button class="stepf">frame ⟩</button>
      <button class="restart">⟲ Restart</button>
      <span class="spacer"></span>
      <span class="rate hidden">blink: <input type="range" min="1" max="8" step="1" value="3"> Hz</span>
      <span class="t">0.00s</span>
    </div>
    <div class="calls">
      <button class="win" data-call="left">◀ Left is better</button>
      <button class="win" data-call="right">Right is better ▶</button>
      <button class="tie" data-call="tie">Tie</button>
      <button class="na" data-call="cannot-assess">Cannot assess</button>
      <input class="note" placeholder="note (optional)">
      <span class="saved"></span>
    </div>
  </section>
</template>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var pairList = (params.get('pairs') || 'auto').split(',').filter(Boolean);
  var ext = params.get('ext') || 'mp4';
  var storeKey = 'gpu-review-' + (params.get('set') || 'A') + '-responses';
  var responses = {};
  try { responses = JSON.parse(localStorage.getItem(storeKey) || '{}'); } catch (e) { responses = {}; }

  // Pair discovery: probe p01..p40 for pairs/<id>_L.<ext> (file:// cannot list dirs).
  var wanted = pairList[0] === 'auto' ? null : pairList;
  var ids = [];
  for (var n = 1; n <= (wanted ? 99 : 40); n++) {
    var id = 'p' + (n < 10 ? '0' + n : n);
    if (!wanted || wanted.indexOf(id) >= 0) ids.push(id);
  }
  var main = document.getElementById('pairs');
  var tpl = document.getElementById('pair-tpl');
  var built = 0;

  ids.forEach(function (id) {
    var node = tpl.content.firstElementChild.cloneNode(true);
    node.setAttribute('data-pair', id);
    node.querySelector('.pid').textContent = id;
    var base = node.querySelector('.v-base'), top = node.querySelector('.v-top');
    base.src = 'pairs/' + id + '_L.' + ext;
    top.src = 'pairs/' + id + '_R.' + ext;
    var dropped = false;
    function kill() { if (!dropped) { dropped = true; node.remove(); refreshCount(); } }
    base.addEventListener('error', kill); top.addEventListener('error', kill);
    base.addEventListener('loadedmetadata', function () { if (!dropped) { built++; wire(node, id, base, top); refreshCount(); } });
    main.appendChild(node);
  });

  function fmt(t) { return (Math.round(t * 100) / 100).toFixed(2) + 's'; }

  function wire(node, id, base, top) {
    var stage = node.querySelector('.stage');
    var divider = node.querySelector('.divider'), tagL = node.querySelector('.tag.l'), tagR = node.querySelector('.tag.r');
    var tEl = node.querySelector('.t'), rateWrap = node.querySelector('.rate'), rateEl = node.querySelector('input[type=range]');
    var mode = 'sbs', blinkTimer = null, blinkOn = false;
    var syncClock = base; // base is the master; top follows

    // ---- sync: top follows base (t start aligned on restart/play)
    function alignTop() { try { top.currentTime = base.currentTime; } catch (e) {} }
    base.addEventListener('timeupdate', function () {
      tEl.textContent = fmt(base.currentTime);
      if (Math.abs(top.currentTime - base.currentTime) > 0.034) alignTop();
    });
    base.addEventListener('ended', function () { base.currentTime = 0; top.currentTime = 0; if (!base.paused) { base.play(); top.play(); } });
    function playBoth() { base.play(); top.play(); }
    function pauseBoth() { base.pause(); top.pause(); }

    // ---- modes
    function setMode(m) {
      mode = m;
      node.querySelectorAll('.mode-btns [data-mode]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-mode') === m); });
      stage.className = 'stage ' + m;
      divider.classList.toggle('hidden', m !== 'slider');
      tagL.classList.toggle('hidden', m === 'sbs');
      tagR.classList.toggle('hidden', m === 'sbs');
      rateWrap.classList.toggle('hidden', m !== 'blink');
      if (blinkTimer) { clearInterval(blinkTimer); blinkTimer = null; }
      if (m === 'slider') { setSplit(split); }
      if (m === 'blink') {
        var hz = parseFloat(rateEl.value);
        blinkTimer = setInterval(function () {
          blinkOn = !blinkOn;
          stage.classList.toggle('show-top', blinkOn);
        }, 1000 / (2 * hz));
      } else { stage.classList.remove('show-top'); }
    }
    node.querySelectorAll('.mode-btns [data-mode]').forEach(function (b) {
      b.addEventListener('click', function () { setMode(b.getAttribute('data-mode')); });
    });

    // ---- slider drag (pointer events; works with touch)
    var split = 0.5;
    function setSplit(f) {
      split = Math.max(0.02, Math.min(0.98, f));
      stage.style.setProperty('--split', (split * 100) + '%');
    }
    function onDrag(ev) {
      var r = stage.getBoundingClientRect();
      setSplit((ev.clientX - r.left) / r.width);
      ev.preventDefault();
    }
    var dragging = false;
    stage.addEventListener('pointerdown', function (ev) {
      if (mode === 'sbs') return;
      if (mode === 'slider') { dragging = true; stage.setPointerCapture(ev.pointerId); onDrag(ev); }
      if (mode === 'blink') { // tap flips instantly (manual blink)
        stage.classList.toggle('show-top');
        if (blinkTimer) { clearInterval(blinkTimer); blinkTimer = null; rateWrap.querySelector('span').textContent = 'blink: manual (tap to flip) — '; }
      }
    });
    stage.addEventListener('pointermove', function (ev) { if (dragging) onDrag(ev); });
    stage.addEventListener('pointerup', function () { dragging = false; });
    stage.addEventListener('pointercancel', function () { dragging = false; });

    // ---- transport
    node.querySelector('.play').addEventListener('click', function () { base.paused ? playBoth() : pauseBoth(); });
    node.querySelector('.restart').addEventListener('click', function () { base.currentTime = 0; top.currentTime = 0; playBoth(); });
    node.querySelector('.stepf').addEventListener('click', function () { pauseBoth(); step(1 / 24); });
    node.querySelector('.stepb').addEventListener('click', function () { pauseBoth(); step(-1 / 24); });
    function step(dt) {
      var t = Math.max(0, Math.min(base.duration || 1e9, base.currentTime + dt));
      base.currentTime = t; top.currentTime = t; tEl.textContent = fmt(t);
    }
    rateEl.addEventListener('input', function () {
      if (mode !== 'blink' || blinkTimer === null) return;
      clearInterval(blinkTimer);
      var hz = parseFloat(rateEl.value);
      blinkTimer = setInterval(function () { blinkOn = !blinkOn; stage.classList.toggle('show-top', blinkOn); }, 1000 / (2 * hz));
    });

    // ---- fullscreen (stage only)
    node.querySelector('.fs').addEventListener('click', function () {
      stage.classList.add('fullscreen-stage');
      var done = function () { document.removeEventListener('fullscreenchange', done); stage.classList.remove('fullscreen-stage'); };
      document.addEventListener('fullscreenchange', done);
      if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen();
    });

    // ---- keyboard: space/arrow keys operate the LAST-HOVERED pair
    node.addEventListener('mouseenter', function () { window.__activePair = node; });
    node.addEventListener('mouseleave', function () { if (window.__activePair === node) window.__activePair = null; });

    // ---- calls
    var savedEl = node.querySelector('.saved');
    function save() {
      responses[id] = responses[id] || {};
      localStorage.setItem(storeKey, JSON.stringify(responses));
      savedEl.textContent = 'saved';
      setTimeout(function () { savedEl.textContent = ''; }, 1200);
      refreshCount();
    }
    node.querySelectorAll('.calls [data-call]').forEach(function (b) {
      b.addEventListener('click', function () {
        node.querySelectorAll('.calls [data-call]').forEach(function (x) { x.classList.remove('sel'); });
        b.classList.add('sel');
        responses[id] = responses[id] || {};
        responses[id].call = b.getAttribute('data-call');
        responses[id].ts = new Date().toISOString();
        save();
      });
    });
    node.querySelector('.note').addEventListener('input', function () {
      responses[id] = responses[id] || {};
      responses[id].note = this.value;
      save();
    });
    // restore prior state
    var prior = responses[id];
    if (prior) {
      if (prior.call) { var b = node.querySelector('.calls [data-call="' + prior.call + '"]'); if (b) b.classList.add('sel'); }
      if (prior.note) node.querySelector('.note').value = prior.note;
    }
    // default: videos autostart muted+looping, synced
    base.muted = top.muted = true;
    base.addEventListener('canplay', function () { if (base.paused && base.readyState >= 3) playBoth(); });
    top.addEventListener('canplay', function () { if (!base.paused) top.play(); });
    setMode('sbs');
  }

  // keyboard (global): space play/pause, arrows step, on hovered pair
  window.addEventListener('keydown', function (ev) {
    var node = window.__activePair;
    if (!node || ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') return;
    var base = node.querySelector('.v-base'), top = node.querySelector('.v-top');
    if (ev.code === 'Space') { ev.preventDefault(); base.paused ? (base.play(), top.play()) : (base.pause(), top.pause()); }
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
      ev.preventDefault(); base.pause(); top.pause();
      var dt = (ev.key === 'ArrowRight' ? 1 : -1) / 24;
      var t = Math.max(0, Math.min(base.duration || 1e9, base.currentTime + dt));
      base.currentTime = t; top.currentTime = t;
      node.querySelector('.t').textContent = fmt(t);
    }
  });

  function refreshCount() {
    var total = document.querySelectorAll('.pair').length, done = 0;
    document.querySelectorAll('.pair').forEach(function (n) { if (responses[n.getAttribute('data-pair')] && responses[n.getAttribute('data-pair')].call) done++; });
    document.getElementById('count').textContent = done + ' / ' + total + ' called';
  }
  refreshCount();

  document.getElementById('export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify({ set: params.get('set') || 'A', exported: new Date().toISOString(), responses: responses }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'review-responses.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  });
})();
</script>
</body>
</html>
