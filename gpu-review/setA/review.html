<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPU review — blinded A/B</title>
<style>
  :root { --bg:#0b0e0d; --surface:#101412; --surface2:#151a17; --line:#252c28; --text:#edf3ef; --muted:#8f9b94; --accent:#c6ff63; --danger:#ff7f7f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 'Segoe UI',system-ui,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:10; }
  header h1 { font-size:16px; margin:0 0 4px; }
  header .sub { color:var(--muted); font-size:12px; }
  main { padding:16px 20px 90px; max-width:1400px; margin:0 auto; }
  .pair { border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:22px; overflow:hidden; }
  .pair-head { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .pair-head .pid { font-weight:700; font-size:15px; }
  .mode-btns { display:flex; gap:4px; margin-left:auto; }
  .mode-btns button { font:inherit; font-size:12px; padding:4px 10px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); border-radius:6px; cursor:pointer; }
  .mode-btns button.on { color:#142000; background:var(--accent); border-color:var(--accent); font-weight:600; }
  .stage { position:relative; background:#000; user-select:none; }
  .stage video, .stage canvas { display:block; width:100%; }
  .stage.sbs { display:block; }
  .stage.slider { cursor:ew-resize; }

  .stage .divider { position:absolute; top:0; bottom:0; width:3px; background:var(--accent); left:var(--split,50%); transform:translateX(-1.5px); pointer-events:none; box-shadow:0 0 8px rgba(198,255,99,.5); }
  .stage .divider::after { content:'⇔'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--accent); color:#142000; font-size:13px; padding:2px 6px; border-radius:8px; font-weight:700; }
  .stage .tag { position:absolute; top:8px; font-size:11px; background:rgba(0,0,0,.65); padding:2px 8px; border-radius:4px; color:var(--muted); }
  .stage .tag.l { left:8px; } .stage .tag.r { right:8px; }
  .stage .probe { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(11,14,13,.92); color:var(--muted); font-size:13px; flex-direction:column; gap:8px; text-align:center; padding:0 20px; }
  .stage .probe progress { width:60%; }
  .transport { display:flex; gap:6px; align-items:center; padding:8px 14px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .transport button { font:inherit; font-size:12px; padding:4px 10px; border:1px solid var(--line); background:var(--surface2); color:var(--text); border-radius:6px; cursor:pointer; }
  .transport button:hover { border-color:var(--muted); }
  .transport button.on { color:#142000; background:var(--accent); border-color:var(--accent); font-weight:600; }
  .transport .t { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .transport .spacer { flex:1; }
  .transport label { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:4px; }
  .transport input[type=range] { width:90px; accent-color:var(--accent); }
  .meta { padding:8px 14px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  .meta .k { color:var(--text); font-weight:600; }
  .meta .meta-shared span { margin-right:14px; white-space:nowrap; display:inline-block; }
  .meta .meta-sides { margin-top:4px; padding-top:4px; border-top:1px dashed var(--line); }
  .meta .meta-sides .side { display:inline-block; margin-right:18px; }
  .meta .meta-sides .badge { background:var(--danger); color:var(--bg); border-radius:4px; padding:0 6px; font-size:10px; font-weight:700; margin-right:6px; }
  .meta .rev-note { font-size:11px; color:var(--danger); }
  .calls { display:flex; gap:6px; padding:10px 14px 14px; flex-wrap:wrap; align-items:center; }
  .calls button { font:inherit; font-size:13px; padding:7px 16px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--text); cursor:pointer; }
  .calls button.win { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .calls button.win.sel { background:var(--accent); color:#142000; }
  .calls button.tie.sel { background:var(--muted); color:var(--bg); border-color:var(--muted); }
  .calls button.na.sel { background:var(--danger); color:var(--bg); border-color:var(--danger); }
  .calls .note { flex:1 1 220px; font:inherit; font-size:12px; padding:6px 10px; border:1px solid var(--line); background:var(--surface2); color:var(--text); border-radius:8px; min-width:180px; }
  .calls .saved { color:var(--muted); font-size:11px; }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line); padding:10px 20px; display:flex; gap:10px; align-items:center; }
  footer .count { color:var(--muted); font-size:12px; }
  footer button { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; font-weight:600; }
  .stage:fullscreen { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:#000; }
  .stage:fullscreen video, .stage:fullscreen canvas { max-height:100vh; width:auto; max-width:100%; }
  .hidden { display:none !important; }
</style>
<style>
.stage { aspect-ratio:9/5; display:flex; align-items:center; justify-content:center; }
.stage.sbs { aspect-ratio:18/5; }
.stage canvas { width:100%; height:auto; }
.stage:fullscreen, .stage.sbs:fullscreen { display:flex; aspect-ratio:auto; }
.stage:fullscreen canvas { width:100%; height:100%; object-fit:contain; max-width:none; }
.stage.slider { touch-action:none; }
.stage.blink { cursor:pointer; }
.stage:focus-visible { outline:2px solid var(--accent); }
.stage .tag { pointer-events:none; }
.empty { padding:30px; color:var(--muted); }
.transport select { background:var(--surface2); color:var(--text); border:1px solid var(--line); padding:4px; }
</style>
</head><body>
<header><h1>GPU review — blinded A/B</h1><div class="sub">Matched presentation frames in every mode. Blink rate is full L/R cycles per second; pause freezes content while automatic blink continues. Choose Manual to tap or press B to flip. Space plays; arrows step. Calls reveal per-side metadata.</div></header>
<main id="pairs"></main>
<footer><span class="count" id="count"></span><span style="flex:1"></span><button id="export">Export responses JS</button></footer>
<template id="pair-tpl"><section class="pair">
<div class="pair-head"><span class="pid"></span><div class="mode-btns">
<button data-mode="sbs" class="on">Side-by-side</button><button data-mode="slider">Slider</button><button data-mode="blink">Blink</button><button class="fs" title="Fullscreen stage">⛶</button></div></div>
<div class="stage sbs" tabindex="0" aria-label="Comparison stage"><canvas></canvas><span class="tag l">L</span><span class="tag r">R</span><div class="probe"><span class="probe-msg">Loading matched frames…</span></div></div>
<div class="transport"><button class="play">▶ Play</button><button class="stepb">⟨ frame</button><button class="stepf">frame ⟩</button><button class="restart">⟲ Restart</button>
<label>frame <input class="scrub" type="range" min="0" value="0" step="1"></label><span class="t"></span><span class="spacer"></span>
<label class="blink-only hidden"><select class="blink-control" aria-label="Blink mode"><option value="auto">Automatic</option><option value="manual">Manual (tap to flip)</option></select></label>
<label class="blink-only hidden">blink <input class="hz" type="range" min="0.5" max="8" step="0.5" value="2"><output class="hz-value">2 Hz</output></label>
<button class="flip blink-only hidden">Flip L/R</button>
<label>speed <select class="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option></select></label></div>
<div class="meta"><div class="meta-shared"></div><div class="meta-sides hidden"></div></div>
<div class="calls"><button class="win" data-call="left">◀ Left is better</button><button class="win" data-call="right">Right is better ▶</button><button class="tie" data-call="tie">Tie</button><button class="na" data-call="cannot-assess">Cannot assess</button><input class="note" placeholder="note (optional)" aria-label="Pair note"><span class="saved"></span></div>
</section></template>
<script src="pairs-metadata.js" onerror="window.PAIR_META=null"></script>
<script src="pairs-frames.js" onerror="window.REVIEW_FRAMES=null"></script>
<script>
'use strict';
(() => {
  const params = new URLSearchParams(location.search);
  const set = (params.get('set') || location.pathname.split('/').slice(-2,-1)[0] || 'review').replace(/^set/, '');
  const storeKey = 'gpu-review-' + set.replace(/^set/, '') + '-responses';
  const validCalls = ['left','right','tie','cannot-assess'];
  let responses = {}, storageError = '';
  try { responses = JSON.parse(localStorage.getItem(storeKey) ?? localStorage.getItem('gpu-review-set' + set + '-responses') ?? '{}'); if (!responses || typeof responses !== 'object' || Array.isArray(responses)) responses = {}; }
  catch (e) { storageError = 'Storage unavailable — export before closing.'; }
  const manifest = window.REVIEW_FRAMES;
  const controllers = [];
  let active = null;
  const main = document.querySelector('#pairs');
  const ids = manifest && manifest.version === 1 ? Object.keys(manifest.pairs) : [];
  const wanted = params.get('pairs');
  if (!ids.length) {
    const message = document.createElement('p'); message.className = 'empty';
    message.textContent = 'No matched frame assets found. After generating pairs, run: python3 scripts/gpu-review/extract-review-frames.py <set-directory>. Then reopen this page.';
    main.append(message);
  }
  function count() {
    document.querySelector('#count').textContent = controllers.filter(c => validCalls.includes(responses[c.id]?.call)).length + ' / ' + controllers.length + ' called';
  }
  // At most two strips per side per pair are retained. Frames are loaded in pairs,
  // and a single synchronous canvas draw commits both sides at the same index.
  function wire(id, data) {
    const node = document.querySelector('#pair-tpl').content.firstElementChild.cloneNode(true);
    node.dataset.pair = id; node.querySelector('.pid').textContent = id; main.append(node);
    const $ = s => node.querySelector(s);
    const stage = $('.stage'), canvas = $('canvas'), ctx = canvas.getContext('2d');
    const probe = $('.probe'), label = $('.t'), scrub = $('.scrub');
    const caches = {L:new Map(), R:new Map()};
    const state = {frame:0, mode:'sbs', playing:false, side:'L', automatic:true, hz:2, speed:1, split:.5, ready:false};
    let images = null, pending = false, requested = null, raf = 0, last = 0, elapsed = 0, blinkElapsed = 0, failure = false;
    const ctl = {id, pause:() => {state.playing=false; $('.play').textContent='▶ Play';}, state};
    controllers.push(ctl);
    scrub.max = data.count - 1;
    function load(side, index) {
      const cache = caches[side];
      if (cache.has(index)) return cache.get(index);
      const promise = new Promise((resolve,reject) => {
        const image = new Image();
        image.onload = async () => {
          try {
            if (image.decode) await image.decode();
            if (image.naturalWidth !== data.width || image.naturalHeight !== data.height * manifest.strip) throw new Error('Frame strip geometry mismatch');
            resolve(image);
          } catch(e) { reject(e); }
        };
        image.onerror = () => reject(new Error('Missing or unreadable frame strip. Regenerate this set.'));
        image.src = data[side][index];
      });
      cache.set(index,promise);
      while(cache.size > 2) cache.delete(cache.keys().next().value);
      return promise;
    }
    function draw() {
      if (!images) return;
      const w=data.width, h=data.height, y=(state.frame % manifest.strip)*h;
      const targetWidth=state.mode==='sbs'?w*2:w;
      if(canvas.width!==targetWidth || canvas.height!==h) {canvas.width=targetWidth;canvas.height=h;}
      const blit=(side,x=0)=>ctx.drawImage(images[side],0,y,w,h,x,0,w,h);
      if(state.mode==='sbs') {blit('L');blit('R',w);}
      else if(state.mode==='slider') {
        blit('R');ctx.save();ctx.beginPath();ctx.rect(0,0,w*state.split,h);ctx.clip();blit('L');ctx.restore();
        ctx.fillStyle='#c6ff63';ctx.fillRect(Math.round(w*state.split)-1,0,2,h);
      } else blit(state.side);
      stage.dataset.frame=state.frame; stage.dataset.side=state.mode==='blink'?state.side:'both';
      label.textContent=`${data.pts[state.frame].toFixed(3)}s · frame ${state.frame} / ${data.count-1}${state.mode==='blink'?' · '+state.side:''}`;
      scrub.value=state.frame;
      $('.tag.l').classList.toggle('hidden',state.mode==='blink');
      $('.tag.r').classList.toggle('hidden',state.mode==='blink');
    }
    async function show(frame) {
      requested = Math.max(0,Math.min(data.count-1,frame));
      if(pending || failure) return;
      pending=true;
      try {
        while(requested!==null) {
          const next=requested;requested=null;
          const index=Math.floor(next/manifest.strip);
          const pair=await Promise.all([load('L',index),load('R',index)]);
          if(requested!==null) continue;
          images={L:pair[0],R:pair[1]};state.frame=next;state.ready=true;draw();probe.classList.add('hidden');
          const future=(index+1)%data.L.length;
          // Decode next strips in advance; errors surface if those frames are requested.
          if(active===ctl) {load('L',future).catch(()=>{});load('R',future).catch(()=>{});}
        }
      } catch(e) {
        failure=true;ctl.pause();probe.classList.remove('hidden');$('.probe-msg').textContent=e.message;
        stage.dataset.error=e.message;
      } finally {pending=false;}
    }
    function animate(now) {
      raf=0;
      if(active!==ctl || document.hidden) return;
      const dt=Math.min(100, now-last);last=now;
      if(state.mode==='blink' && state.automatic && state.ready) {
        blinkElapsed+=dt;
        const halfPeriod=1000/(2*state.hz);
        const flips=Math.floor(blinkElapsed/halfPeriod);
        if(flips) {blinkElapsed%=halfPeriod;if(flips%2) state.side=state.side==='L'?'R':'L';draw();}
      }
      if(state.playing && state.ready && !pending) {
        elapsed+=dt*state.speed;
        if(elapsed>=1000/data.fps) {
          // Never skip content frames: if storage is slow, hold BOTH sides.
          elapsed%=1000/data.fps;show((state.frame+1)%data.count);
        }
      }
      raf=requestAnimationFrame(animate);
    }
    function activate() {
      if(active!==ctl) {controllers.forEach(c=>c.pause());active=ctl;elapsed=0;blinkElapsed=0;}
      if(!raf) {last=performance.now();raf=requestAnimationFrame(animate);}
    }
    function play() {activate();state.playing=!state.playing;elapsed=0;$('.play').textContent=state.playing?'⏸ Pause':'▶ Play';}
    function step(delta) {activate();ctl.pause();elapsed=0;show((requested??state.frame)+delta);}
    function flip() {activate();state.side=state.side==='L'?'R':'L';blinkElapsed=0;draw();}
    node.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{
      activate();state.mode=button.dataset.mode;stage.className='stage '+state.mode;
      node.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b===button));
      node.querySelectorAll('.blink-only').forEach(e=>e.classList.toggle('hidden',state.mode!=='blink'));
      blinkElapsed=0;draw();
    });
    $('.play').onclick=play;$('.stepb').onclick=()=>step(-1);$('.stepf').onclick=()=>step(1);
    $('.restart').onclick=()=>{activate();elapsed=0;show(0);};
    scrub.oninput=()=>{activate();ctl.pause();elapsed=0;show(Number(scrub.value));};
    $('.hz').oninput=()=>{state.hz=Number($('.hz').value);$('.hz-value').textContent=state.hz+' Hz';blinkElapsed=0;};
    $('.speed').onchange=()=>{state.speed=Number($('.speed').value);};
    $('.blink-control').onchange=()=>{activate();state.automatic=$('.blink-control').value==='auto';blinkElapsed=0;};
    $('.flip').onclick=flip;
    let dragging=false;
    function split(event) {
      const rect=canvas.getBoundingClientRect();
      // Fullscreen uses contain: account for letterboxing in pointer coordinates.
      const scale=Math.min(rect.width/canvas.width,rect.height/canvas.height);
      const width=canvas.width*scale, left=rect.left+(rect.width-width)/2;
      state.split=Math.max(0,Math.min(1,(event.clientX-left)/width));draw();
    }
    stage.onpointerdown=event=>{activate();stage.focus();if(state.mode==='blink') flip();if(state.mode==='slider'){dragging=true;stage.setPointerCapture(event.pointerId);split(event);}};
    stage.onpointermove=event=>{if(dragging)split(event);};
    stage.onpointerup=stage.onpointercancel=()=>{dragging=false;};
    node.onfocusin=activate;
    stage.onkeydown=event=>{
      if(event.code==='Space'){event.preventDefault();play();}
      if(event.key==='ArrowRight'){event.preventDefault();step(1);}
      if(event.key==='ArrowLeft'){event.preventDefault();step(-1);}
      if(event.key.toLowerCase()==='b' && state.mode==='blink'){event.preventDefault();flip();}
    };
    $('.fs').onclick=async()=>{try {if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen();}catch(e){label.textContent='Fullscreen unavailable: '+e.message;}};
    const pm=window.PAIR_META?.[id];
    function fields(parent, values) {
      for(const [key,value] of Object.entries(values||{})) {
        const span=document.createElement('span'), k=document.createElement('span');k.className='k';k.textContent=key+' ';span.append(k,document.createTextNode(typeof value==='object'?JSON.stringify(value):String(value)));parent.append(span,document.createTextNode(' '));
      }
    }
    fields($('.meta-shared'),pm?.shared);
    if(!pm) $('.meta-shared').textContent='No generation metadata supplied.';
    function reveal() {
      const sides=$('.meta-sides');sides.replaceChildren();
      if(!validCalls.includes(responses[id]?.call)) {sides.classList.add('hidden');return;}
      sides.classList.remove('hidden');
      for(const side of ['L','R']) {const div=document.createElement('div');div.className='side';const badge=document.createElement('b');badge.className='badge';badge.textContent=side;div.append(badge);fields(div,pm?.[side]);sides.append(div);}
      if(pm?.note) {const note=document.createElement('div');note.className='rev-note';note.textContent=pm.note;sides.append(note);}
    }
    function save() {
      try {localStorage.setItem(storeKey,JSON.stringify(responses));$('.saved').textContent='saved locally';}
      catch(e) {$('.saved').textContent='Storage failed — export before closing.';}
      count();
    }
    node.querySelectorAll('[data-call]').forEach(button=>button.onclick=()=>{
      responses[id]={...responses[id],call:button.dataset.call,ts:new Date().toISOString()};
      save();node.querySelectorAll('[data-call]').forEach(b=>b.classList.toggle('sel',b===button));reveal();
    });
    $('.note').oninput=()=>{responses[id]={...responses[id],note:$('.note').value};save();};
    const prior=responses[id];
    node.querySelectorAll('[data-call]').forEach(b=>b.classList.toggle('sel',b.dataset.call===prior?.call));
    $('.note').value=prior?.note||'';$('.saved').textContent=storageError;reveal();
    show(0);
  }
  for(const id of ids) if(!wanted || wanted.split(',').includes(id)) wire(id,manifest.pairs[id]);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)controllers.forEach(c=>c.pause());});
  count();
  document.querySelector('#export').onclick=()=>{
    const payload={set,exported:new Date().toISOString(),responses};
    const blob=new Blob(['window.REVIEW_RESPONSES = '+JSON.stringify(payload,null,2)+';\n'],{type:'text/javascript'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='review-responses.js';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  };
})();
</script></body></html>
