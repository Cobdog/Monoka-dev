  - region "Model overrides":
    - img
    - strong: Model overrides
    - text: Pin the exact checkpoint, text encoder, or VAE per engine family — for files the name-pattern inference can never find (a community merge, a renamed quant). Auto keeps the inferred pick; a per-chain pick (the chain's properties panel) beats these, which beat auto. The H3 families expose FL2VA / Ref2VA / merged checkpoint lanes; the VAE picks split by decoder — video, audio, and (the workbench only) the T=1 image decoder.
    - strong: MiniMax H3 video
    - text: The FL2VA and Ref2VA picks pin each render lane separately — only the mode's slot loads. The merged pick is ONE pre-merged checkpoint standing in for both lanes when set (unused unless needed). Text encoder is the Qwen3-VL companion; the video and audio VAE picks load the graph's two decoders (nodes 3/4). No image-VAE slot exists here — the video graph is always multi-frame and the Mamad8 T=1 decoder is factory-banned from it.
