    - text: Audio VAE auto/default
    - status: Music 3 needs its own DAV audio VAE (minimax_music3_dav.safetensors) — the H3 video family's audio VAE is a different decoder and never auto-fills this slot.
    - paragraph: "Picks are exact names from the connected engine's model registry — the engine-relative subpath the graph loader accepts. A pick the registry later stops listing falls back to auto with a warning at render time; a pick the family cannot load (wrong folder, a cross-class VAE) refuses the render with the reason — never a doomed graph. The registry lists filenames only, so nothing about a file's internals is verified app-side: the engine loads the pick or fails loudly with a readable error. The H3 families pin FL2VA and Ref2VA per render lane; the merged pick is ONE pre-merged checkpoint for both lanes and wins when set. VAE slots are decoder-specific (video / audio / image): a pick whose filename marks another decoder class refuses — the T=1 image decoder is legal only on the workbench's image-VAE slot, never in a video graph."
