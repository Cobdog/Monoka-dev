  - region "Node packs":
    - img
    - strong: Node packs
    - text: Custom nodes the studio can place on this engine — grouped by the feature they serve, with each row's install state and version verdict beside it. How installs work is one click below.
    - button "Refresh":
      - img
      - text: Refresh
    - status:
      - img
      - text: "ComfyUI-Manager is not serving this engine — the connected engine does not advertise ComfyUI-Manager (the extension.manager.supports_csrf_post feature flag is absent — the pip Manager is not installed, or the engine was not started with --enable-manager). Installs use the studio's own paths: the vendored payload, a consented Fetch…, or a local copy."
    - paragraph: H3 video
    - strong: ComfyUI-VDN-H3
    - text: "Apache-2.0 vendored no install target The VDN port we adopted as our own (upstream removed 2026-09-26 — the vendored tree is the code of record). A node pack, not a fork: VDN-proper is applied as runtime model patches on ComfyUI's native MiniMax-H3 ModelPatcher, nothing outside custom_nodes/, no core patch, no new dependencies. Stage weights are separate Hugging Face fetches that land under models/vdn (the engine enumerates them itself). https://github.com/Saganaki22/ComfyUI-VDN-H3 @ 3eb63496c24c — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Install" [disabled]
    - button "Uninstall" [disabled]
    - strong: ComfyUI-MiniMax-H3-Turbo
    - text: Apache-2.0 user-fetch no install target Larryvrh's turbo-LoRA loader node (the pack the optimization registry detects as larryvrhTurbo) plus the h3_silu_temb_grid fix for pruned bases. License-clean (Apache-2.0) but not vendored yet — install from a local copy of the repo. https://github.com/Larryvrh/ComfyUI-MiniMax-H3-Turbo @ 4274783a23af — a valid ComfyUI checkout (with main.py) is required before packs can be installed.
    - button "Uninstall" [disabled]
    - strong: ComfyUI_MinimaxH3_AutoContext
    - text: "Apache-2.0 user-fetch no install target supElement’s one-click segmented-inference pack for MiniMax H3: prompt-timeline slicing (Clip_Tag/timeline/sequential/global), per-segment reference filtering (only prompt-declared refs are passed), 3-channel inter-segment anchoring (initial-latent splice + video_context_denoise dial, cond-row motion keyframes, untagged context-audio ref), hash-keyed per-segment latent cache with resume, video_guide bridging, audio_drive, and a pixel-domain seam-correction node. Deep-read: docs/research/autocontext-deepread.md. https://github.com/supElement/ComfyUI_MinimaxH3_AutoContext @ f1062d34e3c2 — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Uninstall" [disabled]
    - strong: ComfyUI-H3-Motion-Context
    - text: "GPL-3.0-only user-fetch no install target NikoDemon80's clip-chaining pack for MiniMax H3: pins the tail of the previous clip — picture and sound — so the next clip genuinely continues it (the picture is sliced out of the previous latent with no VAE round trip; the pinned audio window ends at the join so the soundtrack continues rather than restarts). The engine side of canvas latent continuation: chain renders save their sampler latents and latents forks continue from the source clip through these nodes. https://github.com/NikoDemon80/ComfyUI-H3-Motion-Context @ 5335715abe54 — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Uninstall" [disabled]
    - strong: Comfyui_Minimax_h3_latent_Upscaler
    - text: "MIT user-fetch no install target LBH-123-AI's learned latent upscaler for MiniMax H3 (24ch): 2× in latent space, bypassing the 5B-param VAE decode/encode round trip. Powers the upscale registry's LBH latent 2D/3D 2× hires-fix entries — latent-space scaling keeps the audio path intact where the RTX pixel path drops it. The upscaler weights are a separate download into the engine's upscale models root (the engine's own model list is the honest availability signal). https://github.com/LBH-123-AI/Comfyui_Minimax_h3_latent_Upscaler @ 40316cf008b2 — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Uninstall" [disabled]
    - strong: ComfyUI-MiniMaxH3-PreviewOverride
    - text: "MIT user-fetch no install target simsim9-stack's live preview override for MiniMax H3: a single node between the model and the sampler that decodes the H3 video latent itself on every step (a trained 24-channel tiny autoencoder from vae_approx — TAEHV/TAESD only, channel-checked, animated Latent2RGB as the graceful fallback) and streams true-RGB frames over the minimax_h3_preview_override websocket event, suppressing the stock sampler preview while sampling. The maintainer-endorsed answer to the fragile stock preview path (its null-previewer crash class when an arbitrary taeh3* file wins the engine's prefix match). Ships its own 39.4 MB taeh3_decoder.safetensors (minivae/ — copy into vae_approx per its README); the Kijai 9.3 MB fetch row serves the same slot when the pack is absent. https://github.com/simsim9-stack/ComfyUI-MiniMaxH3-PreviewOverride @ d1eb17beb5e1 — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Uninstall" [disabled]
    - paragraph: Studio tooling
    - strong: minimax-lora-form-adapter
    - text: "MIT first-party no install target The studio's own form-adaptive LoRA loader for MiniMax-H3 (first-party code, MIT, independently releasable): detects curve(pruned) vs full-width adaln forms from live tensor shapes on both the model and the LoRA, passes matching/adaln-free LoRAs through the stock machinery, and projects full-width adaln LoRAs onto curve bases at load time (centered [C|1] encoder + adaln bias delta, golden-tested against kijai's published conversion). Installs from the studio's own payload — no network, no third-party license. https://github.com/Cobdog/Monoka-dev @ v1.0.0 — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Install" [disabled]
    - button "Uninstall" [disabled]
    - paragraph: H3 image
    - strong: ComfyUI_MinimaxH3HybridLoader
    - text: "MIT user-fetch no install target scottmudge's hybrid loader for MiniMax H3: overlays selected tensor groups of one checkpoint onto another AT LOAD (MiniMaxH3HybridLoader, block_range_adaln 25..49 = the b25-49 fl2va+ref2va hybrid the H3 Image Workbench packet/T=1 profiles run on). One mmap per checkpoint — no pre-merged duplicate on disk; behaves exactly like the stock loader when the preset is \"none\". https://github.com/scottmudge/ComfyUI_MinimaxH3HybridLoader @ a44c69b02242 — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Uninstall" [disabled]
    - strong: ComfyUI-MiniMax-H3-Image-Studio
    - text: "Unlicense user-fetch no install target astropuzzo's H3 image studio pack: a parallel conditioning implementation (12 nodes, no core patching, no dependencies — works on ComfyUI ≥0.30) that constructs the packed H3 AV latent itself, making single-frame (T=1) latents legal end-to-end and hitting the 9/13-frame packet tiers exactly where stock nodes snap both to a 22-frame sample. The load-bearing classes are the Prepare set + the exact/slice frame decode; its sampling/resolution/selector nodes duplicate capability the app already owns. https://github.com/astropuzzo/ComfyUI-MiniMax-H3-Image-Studio @ 47dea30d0bf0 — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Uninstall" [disabled]
    - strong: ComfyUI-Fizgig-H3-Still
    - text: "MIT user-fetch no install target shootthesound's 94-line stills pack for MiniMax H3 (zero dependencies, official weights only): a true one-frame packed AV latent — the trainer's preview path — plus a decode that replicates the lone latent into the 5-latent temporal group the H3 ViT decoder was chunk-trained on and keeps pixel frame 3 (past the causal lead-in). The stock decode's banded/dark lone-token output fixed at the source; challenges the T=1 lane's Mamad8 decode head-on. https://github.com/shootthesound/ComfyUI-Fizgig-H3-Still @ f3252d2b6c94 — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Uninstall" [disabled]
    - paragraph: Audio
    - strong: comfyui-minimax-h3-audio-T8
    - text: "GPL-3.0-or-later user-fetch no install target T8mars' audio sidecar pack (H3 audio editing). GPL-3.0-or-later: pattern-adopted in our own code where ideas were useful, but fetchable-but-flagged for your own instance via the consent flow — the studio never vendors or redistributes it. The fetcher stamps the resolved HEAD SHA of the main branch at fetch time. https://github.com/T8mars/comfyui-minimax-h3-audio-T8 @ main — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Uninstall" [disabled]
    - paragraph: Krea 2 edit
    - strong: comfyui-krea2edit
    - text: "Apache-2.0 user-fetch no install target lbouaraba's Identity Edit node pack for Krea 2 (Krea2EditModelPatch + Krea2EditGroundedEncode) — the dual-conditioning carrier the krea2_identity_edit_v1_2 LoRA was trained with: the source rides both the in-context VAE latent path (RoPE frame 1) and the image-grounded Qwen3-VL encode. Powers the Instruct, removal and two-reference edit families. https://github.com/lbouaraba/comfyui-krea2edit @ 86f886dac230 — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Uninstall" [disabled]
    - strong: krea2-anypaint
    - text: MIT user-fetch no install target alexw5702-afk's AnyPaint nodes (Krea2AnyPaintPrepare/Encode/ModelPatch) for the krea2_anypaint_rank32 functional adapter — arbitrary-mask inpaint/outpaint/mixed edits on Krea 2 Turbo with per-step latent restoration, a 384px semantic reference and an isolated reference K/V cache. Powers the refine and outpaint edit families. https://github.com/alexw5702-afk/krea2-anypaint @ 675be5a91ead — a valid ComfyUI checkout (with main.py) is required before packs can be installed.
    - button "Uninstall" [disabled]
    - strong: comfyui-krea2-ostris-edit
    - text: "MIT user-fetch no install target ostris' Kontext-style multi-reference edit conditioning for Krea 2 (TextEncodeKrea2OstrisEdit + Krea2OstrisEditModelPatch): reference images ride the Qwen3-VL encode AND attach as VAE reference latents, carried by the patched model as t=0 tokens (\"index_timestep_zero\", the ai-toolkit recipe) with an optional isolated reference K/V cache. Powers the krea2edit.ostris inpaint-edit family with Cierpliwy's krea2-inpaint-edit LoRA (the black-region masked-edit weights). https://github.com/ostris/ComfyUI-Krea2-Ostris-Edit @ 7756566160c4 — a valid ComfyUI checkout (with main.py) is required before packs can be installed."
    - button "Uninstall" [disabled]
    - group:
      - strong: How node-pack installs work
      - text: targets, pins, licenses, what uninstall touches +>
