- main:
  - img
  - text: No generation yet — describe what you want and generate. The packet lands here as ONE take; its frames line up on the take strip below.
  - complementary:
    - text: Intent
    - textbox "Intent":
      - /placeholder: "Ownership contract, generated for you: name what each picture contributes (\"Keep the identity from <Picture 1>; use the style from <Picture 2>\") and let the Keep dial phrase the preservation of unspecified traits."
    - group: Ownership contract (generated — never hand-written)
    - paragraph: "A single-frame render has no packet neighbors — there is no scorer pick and no burst-fuse; what lands IS the image. Reference quality carries the output: identity-class refs ride native transport, and the reference prep scales longest-side, never cropping."
    - paragraph: "H3ImagePrepare — the MiniMax H3 Image Studio pack (user-fetch: Settings → Node packs → ComfyUI-MiniMax-H3-Image-Studio, Fetch…). Stock engines refuse this profile's single-frame latent at validation (ComfyUI issue #15644: the stock conditioning node enforces length ≥ 5 server-side), so without the pack's conditioning the render would fail on the engine — never a silent submit."
    - button "Get the missing pieces…"
    - strong: References
    - text: 0/9
    - paragraph: "9 native references is the v1 budget (the engine's REF2VA cap). More requires RefMod bundling, which arrives with the RefMod factory — for now, curate down: keep the identity anchor plus one reference per distinct role, and drop near-duplicates (they are what blurs into a hybrid). Semantic-only overflow is an expert experimental toggle, off by default."
    - button "add image"
    - button "from canvas"
